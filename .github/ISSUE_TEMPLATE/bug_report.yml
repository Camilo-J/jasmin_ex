name: Bug report
description: Report behavior that is not working as expected.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior you observed and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Share steps if you have them. If it is intermittent, describe when it occurs instead.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Describe the behavior you expected, if known.
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: Include the JasminEx version and relevant runtime or service versions, if known.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Optional. Remove credentials, tokens, phone numbers, message content, and other sensitive data before sharing.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add anything else that may help investigate.
